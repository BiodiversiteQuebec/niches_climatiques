project:
  type: book
  output-dir: ../docs
  resources:
    - results/

execute:
  echo: false
  cache: true
  message: false
  warning: false

prefer-html: true  

book:
  title: "Niches climatiques / méthodologie"
  author: "François Rousseu"
  date: today
  chapters:
    - index.qmd
    - intro.qmd
    - occurrences.qmd
    - variables.qmd
    - espèces.qmd
    - modélisation.qmd
    - scénarios.qmd
    - résultats.qmd
    - references.qmd
    

bibliography: references.bib
lang: fr

language:
  crossref-tbl-title: "Tableau"

format:
  html:
    theme: cosmo
    grid:
      body-width: 900px      # default: 900px
      sidebar-width: 300px    # default: 250px
      margin-width: 300px     # default: 300px (right TOC)    
    fontsize: 1.1em  
    toc-title: "Sections"
  pdf:
    documentclass: scrreprt
    prefer-html: true 
    pdf-engine: xelatex
    link-citations: true
    dev: cairo_pdf
    include-in-header:
      text: |
        \usepackage{longtable}
        \usepackage{booktabs}
        \usepackage{caption}
        \usepackage{colortbl}
        \usepackage{array}    
        \usepackage{fontspec}
        \newfontfamily{\symbolfont}{Symbola}
        \newcommand{\usym}[1]{{\symbolfont #1}}
        


